    <script>
      // Gracefully handle WebSocket / HMR rejections in preview proxy environments
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var isWs = reason && (
          (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('ws') !== -1)) ||
          (reason.message && (reason.message.indexOf('WebSocket') !== -1 || reason.message.indexOf('ws') !== -1)) ||
          (reason.target && typeof WebSocket !== 'undefined' && reason.target instanceof WebSocket)
        );
        if (isWs) {
          console.debug('[Vite HMR/WebSocket Rejection handled]:', reason);
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.target && typeof WebSocket !== 'undefined' && event.target instanceof WebSocket) {
          console.debug('[Vite HMR/WebSocket Error handled]');
          event.preventDefault();
        }
      }, true);
    </script>
